services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: ecm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecm_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ecm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecm-network

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: ecm-redis
    restart: unless-stopped
    # Redis stores OTPs, payment intents and JWT revocation markers. AOF plus
    # a named volume preserves revocation state across a normal restart.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --aof-use-rdb-preamble
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 64mb
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --save
      - "60"
      - "10000"
      - --dir
      - /data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecm-network

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-ecm-postgres-v2}
    driver: local
  redis_data:
    name: ${REDIS_VOLUME_NAME:-ecm-redis}
    driver: local

networks:
  ecm-network:
    driver: bridge
